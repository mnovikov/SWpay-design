<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paymania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root,[data-dir="graphite"]{--bg:#161617;--card:#232325;--card-2:#2c2c2f;--line:#ffffff10;--ink:#f4f4f5;--ink-2:#a1a1a6;--ink-3:#6e6e74;--acc:#22c55e;--acc-ink:#0b1a10;--pos:#4ade80;--warn:#f5a14a;--neg:#f0616d;--tile-on:#f4f4f5;--tile-on-ink:#161617;--r:18px;--r-sm:14px;--glow:none;--bd:none}
[data-dir="obsidian"]{--bg:#070908;--card:#101412;--card-2:#161b18;--line:#22c55e1f;--ink:#effaf2;--ink-2:#93a69a;--ink-3:#5d6e63;--tile-on:#22c55e;--tile-on-ink:#04130a;--r:24px;--r-sm:18px;--glow:radial-gradient(60% 100% at 30% 0%,#22c55e33,transparent 70%);--bd:1px solid var(--line)}
[data-dir="chalk"]{--bg:#efeee9;--card:#ffffff;--card-2:#f5f4ef;--line:#0000000f;--ink:#141414;--ink-2:#5f5f5a;--ink-3:#9a9a93;--acc:#16a34a;--acc-ink:#fff;--pos:#16a34a;--warn:#d97706;--neg:#dc2626;--tile-on:#141414;--tile-on-ink:#fff;--r:20px;--r-sm:14px;--glow:none;--bd:1px solid var(--line)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}a:hover{color:var(--pos)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",monospace;font-size:.92em}
.t-pos{color:var(--pos)}.t-neg{color:var(--neg)}.t-warn{color:var(--warn)}.t-mute{color:var(--ink-2)}.t-ink{color:var(--ink)}.t-acc{color:var(--acc)}
.sm{font-size:13px}.big{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pm{position:relative;min-height:100vh}
.glow{position:absolute;inset:0 0 auto 0;height:420px;background:var(--glow);pointer-events:none;z-index:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,40px);background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
.top__brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:800;font-size:20px;line-height:1;padding-bottom:3px}
.wm{font-weight:800;font-size:19px;letter-spacing:-.03em}
.top__user{display:flex;align-items:center;gap:10px;margin-left:12px;min-width:0}
.top__user b{display:block;font-size:14px}.top__user small{display:block;color:var(--ink-2);font-size:12px}
.top__apps{margin-left:auto;display:flex;gap:4px;background:var(--card);border:var(--bd);border-radius:999px;padding:4px}
.top__apps button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.top__apps button.on{background:var(--card-2);color:var(--ink)}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.iconbtn:hover{background:var(--card);color:var(--ink)}
.iconbtn--bell{background:var(--card);border:var(--bd);color:var(--ink)}
.iconbtn--bell em{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:700 10px/16px Manrope;font-style:normal;text-align:center}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:12px clamp(16px,4vw,40px) 60px}
.grid-home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:start}
.grid-home--3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}.stack-sm{display:flex;flex-direction:column;gap:10px}.stack-lg{display:flex;flex-direction:column;gap:28px}
.row-sb{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.row-gap{display:flex;gap:10px;flex-wrap:wrap}.row-gap-xs{display:inline-flex;gap:4px;align-items:center}
.bal{display:flex;flex-direction:column;gap:6px;padding:8px 2px 4px}
.bal__l{color:var(--ink-2);font-weight:600}
.bal__v{font-size:clamp(40px,5vw,56px);font-weight:800;letter-spacing:-.04em;line-height:1.05;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bal__v small{font-size:20px;color:var(--ink-2);font-weight:600;letter-spacing:0}
.bal__t{color:var(--ink-2);font-weight:600}
.bal__a{display:flex;gap:10px;margin-top:10px}
.bal__a .act{flex:1}
.tiles{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:94px;padding:14px 8px;border-radius:var(--r);background:var(--card);border:var(--bd);font-weight:600;font-size:14px;transition:background .15s,transform .1s}
.tile:hover{background:var(--card-2)}.tile:active{transform:scale(.98)}
.tile--on,.tile--on:hover{background:var(--tile-on);color:var(--tile-on-ink);border-color:transparent}
.tile--wide{grid-column:1/-1}
.tile__badge{position:absolute;top:10px;right:12px;min-width:20px;height:20px;border-radius:10px;background:var(--neg);color:#fff;font:700 11px/20px Manrope;font-style:normal}
.blk{display:flex;flex-direction:column;gap:12px}
.blk__head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.blk__head h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px}
.blk__head h2 small{font-size:15px;color:var(--ink-3);font-weight:600}
.card{background:var(--card);border:var(--bd);border-radius:var(--r)}
.card--pad{padding:18px}
.qbtn{width:38px;height:38px;border-radius:50%;background:var(--card);border:var(--bd);color:var(--ink-2);font-weight:700}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:transparent}
.seg button{padding:7px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.on{background:var(--card-2);color:var(--ink)}
.sub__body>.seg{align-self:flex-start;background:var(--card);border:var(--bd)}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv>div{display:flex;flex-direction:column;gap:4px}.kv__r{text-align:right}
.kv span{color:var(--ink-2);font-weight:600;font-size:14px}.kv b{font-size:20px;font-weight:700}
.prog{display:flex;gap:4px;height:10px;border-radius:6px;background:var(--card-2);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;border-radius:6px}
.fold{display:flex;flex-direction:column;gap:8px}
.fold__head{display:flex;align-items:center;gap:12px;padding:6px 2px;text-align:left;width:100%}
.fold__head b{font-size:17px}.fold__head small{color:var(--ink-3);font-weight:700;font-size:16px}
.fold__right{margin-left:auto}
.fold__chev{color:var(--ink-2);transition:transform .2s;display:flex}
.fold--open .fold__chev{transform:rotate(180deg)}
.stack-sm>.fold{background:var(--card);border:var(--bd);border-radius:var(--r);padding:10px 14px}
.fold__body{display:flex;flex-direction:column;gap:8px}
.sq{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--card-2);color:var(--ink-2)}
.sq--pos{background:#22c55e;color:#04130a}.sq--warn{background:var(--warn);color:#241200}.sq--neg{background:var(--neg);color:#fff}
.li .sq--pos{background:color-mix(in oklab,var(--pos) 18%,transparent);color:var(--pos)}.li .sq--warn{background:color-mix(in oklab,var(--warn) 18%,transparent);color:var(--warn)}.li .sq--neg{background:color-mix(in oklab,var(--neg) 18%,transparent);color:var(--neg)}
.mini-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--card);border:var(--bd);font-weight:700}
.mini-row small{color:var(--ink-3);font-size:15px}.mini-row b{margin-left:auto}
.cur{width:30px;height:30px;border-radius:9px;background:oklch(0.6 0.1 230);color:#fff;display:grid;place-items:center;font-size:14px}
.bars{display:flex;gap:10px;height:180px;align-items:stretch}
.bars__c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;align-items:center}
.bars__b{width:100%;border-radius:12px 12px 6px 6px;background:linear-gradient(var(--card-2),color-mix(in oklab,var(--card-2) 40%,transparent))}
.bars__c.on .bars__b{background:linear-gradient(var(--acc),color-mix(in oklab,var(--acc) 15%,transparent))}
.bars__c span{font-size:12px;color:var(--ink-3);font-weight:600}.bars__c.on span{color:var(--ink)}
.subhead{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;margin:6px 0 18px}
.subhead h1{margin:0;text-align:center;font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.03em}
.sub{display:flex;flex-direction:column}
.sub__tiles{margin-bottom:28px}
.sub__tiles .tile{min-height:78px;font-size:13px}
.sub__body{display:flex;flex-direction:column;gap:16px;max-width:880px;width:100%;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-radius:var(--r-sm);background:var(--card);border:var(--bd);color:var(--ink-3)}
.search input{flex:1;background:none;border:0;outline:none;font-size:15px;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.people{display:flex;flex-direction:column}
.person{display:flex;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.person .ava{width:58px;height:58px;font-size:19px}
.person__b{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.person__b>b{font-size:17px}.person__st{font-weight:700;font-size:17px}
.person__id{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3)}
.list{display:flex;flex-direction:column;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li>b{flex:1}
.li__b{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.li__b b{font-size:15px}.li__b small{color:var(--ink-2);font-size:13px}
.li__r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.li__r small{color:var(--ink-3);font-size:12.5px}
.li__tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:700;background:var(--card-2);color:var(--ink-2)}
.pill--acc{background:color-mix(in oklab,var(--acc) 16%,transparent);color:var(--pos)}
.nav-row{display:flex;align-items:center;gap:14px;padding:18px;width:100%;text-align:left;font-size:16px}
.nav-row b{flex:1}.nav-row .ic{color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:var(--r-sm);font-weight:700;font-size:15px;flex:1}
.btn--ghost{background:var(--card);border:var(--bd)}
.btn--acc{background:var(--acc);color:var(--acc-ink)}
.btn--block{width:100%;flex:none}
.act{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:var(--r-sm);background:var(--card);border:var(--bd);font-weight:700;font-size:15px;width:100%}
.act:hover{background:var(--card-2)}
.act--warn{color:var(--warn)}.act--neg{color:var(--neg)}
.link{color:var(--acc);font-weight:700;font-size:14px}
.figs{display:grid;gap:12px}.figs--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.fig{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r);background:var(--card);border:var(--bd);min-width:0}
.fig span{color:var(--ink-2);font-weight:600;font-size:14px}
.fig b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.fig small{color:var(--ink-3);font-size:12.5px;font-weight:600}
.fig--acc{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.fig--acc span,.fig--acc small{color:color-mix(in oklab,var(--acc-ink) 72%,transparent)}
.streak{display:flex;justify-content:space-between}
.streak__d{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);font-weight:600}
.streak__d i{width:34px;height:34px;border-radius:50%;background:var(--card-2);display:grid;place-items:center}
.streak__d.done i{background:var(--acc);color:var(--acc-ink)}
.streak__d.now i{background:none;border:3px solid var(--acc);border-right-color:var(--card-2)}
.req{display:flex;align-items:center;gap:14px;padding:12px;border-radius:var(--r-sm);background:var(--card-2)}
.req__chip{width:46px;height:32px;border-radius:7px;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 5px;flex:none}
.req__chip span{font:600 9px "JetBrains Mono",monospace;color:#fff}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--ink-3);padding:48px}
@media (max-width:1100px){.grid-home--3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid-home--3>.col:last-child{grid-column:1/-1}}
@media (max-width:820px){.grid-home,.grid-home--3{grid-template-columns:minmax(0,1fr)}.top__user{display:none}.figs--3{grid-template-columns:minmax(0,1fr)}.sub__tiles .tiles{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media (max-width:520px){.wm{display:none}.top__apps button{padding:7px 10px}.blk__head h2{font-size:21px}}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#161617"><svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><rect x="36" y="36" width="48" height="48" rx="15" fill="#22c55e"/><text x="60" y="70" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="32" fill="#0b1a10">p</text></svg></template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="pm/pm-ui.jsx"></script>
<script type="text/babel" src="pm/pm-data.jsx"></script>
<script type="text/babel" src="pm/pm-admin.jsx"></script>
<script type="text/babel" src="pm/pm-roles.jsx"></script>
<script type="text/babel" src="pm/pm-app.jsx"></script>
</body>
</html>
