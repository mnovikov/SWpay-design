<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrowdPay — Merchant Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #ffffff;
  --paper-2: #f7f7f5;
  --paper-3: #ececea;
  --ink: #141414;
  --ink-2: #2e2e2e;
  --ink-3: #6e6e72;
  --ink-4: #aeaeb2;
  --line: #ececea;
  --line-2: #dedede;
  --accent: #ffc107;
  --accent-2: #ffd54f;
  --accent-soft: #fff4c2;
  --accent-ink: #4a3500;
  --plum: #1d1d1f;
  --plum-soft: #ececea;
  --teal: #ffc107;
  --teal-soft: #fff4c2;
  --ok: #2f9956;
  --ok-soft: #d6efe0;
  --warn: #d98a1c;
  --warn-soft: #fbe9c8;
  --bad: #d94248;
  --bad-soft: #fadcde;
  --info: #3a7bd5;
  --info-soft: #dde9fa;
  --radius: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 0 rgba(15,15,15,0.03), 0 2px 6px rgba(15,15,15,0.04);
  --shadow-md: 0 1px 0 rgba(15,15,15,0.04), 0 8px 24px rgba(15,15,15,0.06);
  --shadow-lg: 0 10px 40px rgba(15,15,15,0.14);
  --font-sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Fraunces", "Inter Tight", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}

body.dark {
  /* Pure black + yellow */
  --paper: #0a0a0a;
  --paper-2: #2a2a2a;
  --paper-3: #353535;
  --ink: #fafafa;
  --ink-2: #e4e4e7;
  --ink-3: #a1a1aa;
  --ink-4: #71717a;
  --line: #3a3a3a;
  --line-2: #484848;
  --accent: #ffc107;
  --accent-2: #ffd54f;
  --accent-soft: #2a2200;
  --accent-ink: #ffd54f;
  --plum-soft: #1f1830;
  --teal-soft: #2a2200;
  --ok-soft: #112a1a;
  --warn-soft: #2e1e08;
  --bad-soft: #2e1416;
  --info-soft: #0f1d33;
  --shadow-sm: 0 1px 0 rgba(0,0,0,0.5), 0 2px 6px rgba(0,0,0,0.35);
  --shadow-md: 0 1px 0 rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.45);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.65);
}
body.dark { background: var(--paper) !important; background-image: none !important; color: var(--ink); }
body.dark .topbar,
body.dark .topbar__search,
body.dark .topbar__kbd,
body.dark .btn,
body.dark .chip,
body.dark .table-wrap,
body.dark .table-foot,
body.dark .page-btn,
body.dark .drawer,
body.dark .drawer__id,
body.dark .drawer__close,
body.dark .section,
body.dark .field__input,
body.dark .modal,
body.dark .stat,
body.dark .tab--active,
body.dark .timeline li::before,
body.dark .settings__nav,
body.dark .hero-card,
body.dark .pd-card,
body.dark .pd-card__limit,
body.dark .term-card,
body.dark .term-card--offline,
body.dark .term-card__stats,
body.dark .copy-btn {
  background: var(--paper-2);
  color: var(--ink);
  border-color: var(--line);
}
body.dark .table thead th,
body.dark .drawer__head,
body.dark .modal__head,
body.dark .drawer__foot,
body.dark .modal__foot,
body.dark .tabs { background: var(--paper-3); }
body.dark .table tbody td { border-bottom-color: var(--line); }
body.dark .table tbody tr:hover { background: var(--paper-3); }
body.dark .table tbody tr.is-selected { background: var(--accent-soft); }
body.dark .btn--primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
body.dark .btn--primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
body.dark .btn--accent { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
body.dark .btn--accent:hover { background: var(--accent-2); border-color: var(--accent-2); }
body.dark .chip--active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
body.dark .chip--active .chip__count { background: rgba(0,0,0,0.22); color: #000; }
body.dark .nav-item--active, body.dark .nav-item--active:hover { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: 0 4px 14px rgba(255,193,7,0.25); }
body.dark .nav-item--active .nav-item__icon { background: rgba(0,0,0,0.18); color: #000; }
body.dark .nav-item--active .nav-item__icon svg { stroke: #000; }
body.dark .nav-item--active .nav-item__count { background: rgba(0,0,0,0.22); color: #000; }
body.dark .nav-item:hover { background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--accent); }
body.dark .nav-item--active:hover { background: var(--accent); color: #000; box-shadow: 0 4px 14px rgba(255,193,7,0.25); }
body.dark .nav-item__icon { background: var(--paper-3); }
body.dark .nav-item__count { background: var(--paper-3); }
body.dark .page-btn--active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
body.dark .settings__nav button.is-active { background: var(--accent); color: #000; font-weight: 600; }
body.dark .tab--active { background: var(--accent); color: #000; box-shadow: 0 2px 8px rgba(255,193,7,0.2); }
body.dark .empty { background: var(--paper-2); border-color: var(--line); }
body.dark .note { background: var(--paper-3); border-color: var(--line); color: var(--ink-2); }
body.dark .badge-type { background: var(--paper-3); color: var(--ink); }
body.dark .pill--neutral { background: var(--paper-3); color: var(--ink-3); }
body.dark .usage__bar { background: var(--paper-3); }
body.dark .pd-card__limit-bar { background: var(--paper-3); }
body.dark .term-card--offline::before { background: var(--bad); }
body.dark .wf-placeholder { background: var(--paper-3); border-color: var(--line-2); }
body.dark .sidebar { background: var(--paper) !important; }
body.dark .sidebar__brand-tag { background: var(--paper-3); }
body.dark .sidebar__theme-btn { background: var(--paper-2); color: var(--ink-2); border-color: var(--line); }
body.dark .sidebar__theme-btn:hover { background: var(--paper-3); }
body.dark .copy-btn:hover { color: var(--ink); border-color: var(--ink-4); background: var(--paper-3); }
body.dark .attn-list li { background: var(--paper-2); border-color: var(--line); }
body.dark .attn-list li:hover { background: var(--paper-3); }
body.dark .risk-list li { background: var(--paper-3); border-color: var(--line); }
body.dark .risk-list li:hover { background: var(--paper-2); }
body.dark pre { background: var(--paper-3) !important; border-color: var(--line) !important; }

/* App banner (sidebar wordmark) — dark */
body.dark .app-banner { background: transparent !important; color: var(--ink) !important; border-bottom: none !important; box-shadow: none !important; }
body.dark .app-banner__wordmark-1 { color: var(--ink); }
body.dark .app-banner__wordmark-2 { color: var(--accent); }
body.dark .app-banner__mark { background: var(--accent) !important; color: var(--ink) !important; box-shadow: 0 2px 0 rgba(255,193,7,0.35) !important; }
body.dark .app-banner__role { color: var(--ink-3) !important; background: var(--paper-3) !important; border-color: var(--line) !important; }

/* Hero accent card — dark */
body.dark .hero-card--accent { background: linear-gradient(180deg, #ffd54f 0%, #ffc107 100%); color: #000; border-color: transparent; }
body.dark .hero-card--accent .hero-card__label,
body.dark .hero-card--accent .hero-card__sub { color: rgba(0,0,0,0.7); }
body.dark .hero-card--accent .hero-card__value { color: #000; }
body.dark .hero-card--accent .hero-card__value .ccy { color: rgba(0,0,0,0.6); }
body.dark .hero-card--accent .btn { background: #000; color: #fff; border-color: #000; }
body.dark .hero-card--accent .btn--ghost { background: rgba(0,0,0,0.08); color: #000; border-color: rgba(0,0,0,0.2); }

/* Topbar app-tag + stats — dark */
body.dark .topbar__app-tag { background: var(--accent-soft) !important; color: var(--accent) !important; border-color: rgba(255,193,7,0.3) !important; }
body.dark .topbar__app-tag:hover { background: #3a3000 !important; color: var(--accent-2) !important; border-color: rgba(255,193,7,0.5) !important; }
body.dark .topbar__app-tag::before { background: var(--accent) !important; box-shadow: 0 0 6px rgba(255,193,7,0.4); }
body.dark .topbar__stats { background: var(--accent) !important; border-color: var(--accent) !important; color: #000 !important; box-shadow: 0 4px 14px rgba(255,193,7,0.2); }
body.dark .topbar__stat + .topbar__stat { border-left-color: rgba(0,0,0,0.18) !important; }
body.dark .topbar__stat-icon { background: rgba(0,0,0,0.14) !important; color: #000 !important; }
body.dark .topbar__stat-icon svg { color: #000 !important; }
body.dark .topbar__stat-value { color: #000 !important; }
body.dark .sidebar__footer .sidebar__avatar { background: var(--accent) !important; color: #000 !important; }

.sidebar__theme-btn {
  margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer;
  color: var(--ink-2); transition: background .12s, color .12s, border-color .12s;
}
.sidebar__theme-btn:hover { background: var(--paper-2); color: var(--ink); }
.sidebar__theme-btn svg { width: 16px; height: 16px; display: block; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ── Layout shell ───────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 256px 1fr; height: 100vh; }
.sidebar { padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); overflow-y: auto; }
.sidebar__group { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-4); padding: 14px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); cursor: pointer; user-select: none; font-size: 14px; font-weight: 500; border: none; background: transparent; text-align: left; width: 100%; }
.nav-item:hover { background: var(--paper-2); box-shadow: inset 0 0 0 1px var(--accent); }
.nav-item--active, .nav-item--active:hover { background: var(--accent); color: var(--ink); box-shadow: 0 4px 14px rgba(255,193,7,0.3); }
.nav-item--active .nav-item__count { color: var(--ink); }
.nav-item--disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
.nav-item--disabled .nav-item__count { background: var(--paper-2); color: var(--ink-4); font-family: var(--font-sans); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.nav-item__icon { width: 24px; height: 24px; background: var(--paper-2); border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 12px; flex-shrink: 0; color: var(--ink-2); }
.nav-item--active .nav-item__icon { background: rgba(0,0,0,0.12); color: var(--ink); }
.nav-item__icon svg { width: 14px; height: 14px; display: block; stroke-width: 1.6; }
.nav-item--active .nav-item__icon svg { stroke: var(--ink); }
.nav-item__count { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); padding: 1px 7px; border-radius: 999px; background: var(--paper-2); }
.nav-item--active .nav-item__count { background: rgba(0,0,0,0.12); color: var(--ink); }
.sidebar__footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); }
.sidebar__avatar { width: 34px; height: 34px; background: var(--accent); color: var(--ink); border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; }

/* ── App banner (sidebar wordmark) ──────────────────────────────────────── */
.app-banner {
  background: transparent;
  color: var(--ink);
  padding: 0 8px 14px;
  margin: -10px 0 10px;
  border-bottom: none;
  min-height: auto;
  box-sizing: border-box;
  display: flex;
  align-items: center;
}
.app-banner__row { display: flex; align-items: center; gap: 10px; flex: 1; }

/* ── Environment badge + info tooltip ──────────────────────────────────── */
.env-badge { margin-left: auto; position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 7px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--line); font-family: var(--font-mono); cursor: default; outline: none; }
.env-badge:hover, .env-badge:focus-visible { border-color: var(--line-2); }
.env-badge--inline { margin-left: 6px; }
.env-badge--on-dark { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18); }
.env-badge--on-dark:hover, .env-badge--on-dark:focus-visible { border-color: rgba(255,255,255,0.32); }
.env-badge__dot { width: 6px; height: 6px; border-radius: 50%; }
.env-badge__code { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; }
.env-tip { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; width: 212px; padding: 12px 13px 13px; background: var(--paper); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.16), 0 2px 6px rgba(0,0,0,0.06); opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .14s ease, transform .14s ease; text-align: left; }
.env-badge:hover .env-tip, .env-badge:focus-visible .env-tip { opacity: 1; transform: translateY(0); pointer-events: auto; }
.env-tip::before { content: ""; position: absolute; top: -5px; right: 14px; width: 9px; height: 9px; background: var(--paper); border-left: 1px solid var(--line-2); border-top: 1px solid var(--line-2); transform: rotate(45deg); }
.env-tip__head { display: flex; align-items: center; gap: 7px; }
.env-tip__dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.env-tip__env { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
.env-tip__env-label { font-size: 11px; color: var(--ink-3); margin-left: auto; }
.env-tip__rows { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
.env-tip__row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 11.5px; }
.env-tip__row > span { color: var(--ink-3); }
.env-tip__row > b { color: var(--ink); font-family: var(--font-mono); font-size: 11px; font-weight: 600; white-space: nowrap; }
.env-tip__divider { height: 1px; background: var(--line); margin: 10px -13px; }
.env-tip__status { display: inline-flex; align-items: center; gap: 5px; }
.env-tip__status i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
body.dark .env-tip { background: var(--paper-2); border-color: var(--line-2); }
body.dark .env-tip::before { background: var(--paper-2); }
.app-banner__mark {
  width: 40px; height: 40px;
  background: var(--accent);
  color: var(--ink);
  border-radius: 10px;
  display: grid; place-items: center;
  flex: none;
  box-shadow: 0 2px 0 rgba(255,193,7,0.45);
}
.app-banner__mark svg { display: block; width: 24px; height: 24px; }
.app-banner__wordmark {
  font-family: var(--font-sans);
  font-weight: 800;
  font-size: 25px;
  letter-spacing: -0.03em;
  line-height: 1;
  display: inline-flex;
  align-items: baseline;
}
.app-banner__wordmark-1 { color: var(--ink); }
.app-banner__wordmark-2 { color: var(--accent); margin-left: 1px; }
.app-banner__role {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--paper-2);
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
}

.main { display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 14px 32px; border-bottom: 1px solid var(--line); background: var(--paper); min-height: 62px; box-sizing: border-box; }
.topbar__crumbs { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); }
.topbar__crumbs strong { color: var(--ink); font-weight: 600; font-size: 14px; }
.topbar__search { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; color: var(--ink-3); min-width: 260px; box-shadow: var(--shadow-sm); }
.topbar__kbd { margin-left: auto; border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; font-size: 10.5px; background: var(--paper); font-family: var(--font-mono); }

.topbar__app-tag {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px 5px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink);
  font-size: 12px; font-weight: 600;
  border: 1px solid rgba(255,193,7,0.55);
  cursor: pointer; font-family: inherit;
  transition: background .12s, border-color .12s;
}
.topbar__app-tag:hover { background: #ffe98a; border-color: rgba(255,193,7,0.8); }
.topbar__app-tag::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
}

.topbar__stats {
  margin-left: auto;
  display: flex; gap: 0;
  padding: 3px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  border: 1px solid rgba(255,193,7,0.55);
}
.topbar__stat { display: flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px; min-width: 0; }
.topbar__stat + .topbar__stat { border-left: 1px solid rgba(255,193,7,0.35); }
.topbar__stat-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(255,193,7,0.28); font-size: 12px; line-height: 1; color: var(--accent-ink); }
.topbar__stat-icon svg { width: 12px; height: 12px; display: block; stroke-width: 2; color: var(--accent-ink); }
.topbar__stat-value { font-family: var(--font-sans); font-weight: 700; font-size: 14px; letter-spacing: -0.01em; line-height: 1.1; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; color: var(--accent-ink); }
.topbar__stat-value .ccy { font-size: 0.72em; font-weight: 500; opacity: 0.78; margin-left: 2px; }

.content { flex: 1; overflow: auto; padding: 26px 32px 60px; position: relative; }

/* ── Mobile burger button ─────────────────────────────────────────────── */
.topbar__burger {
  display: none;
  width: 36px; height: 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  font-size: 16px;
  cursor: pointer;
  align-items: center; justify-content: center;
  padding: 0;
}
body.dark .topbar__burger { background: var(--paper-2); color: var(--ink); border-color: var(--line); }
.sidebar__overlay { display: none; }

/* ── Mobile layout ────────────────────────────────────────────────────── */
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 280px; max-width: 86vw;
    z-index: 100;
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    background: var(--paper) !important;
    box-shadow: 8px 0 32px rgba(0,0,0,0.25);
  }
  .sidebar.is-open { transform: translateX(0); }
  .sidebar__overlay {
    display: block;
    position: fixed; inset: 0;
    background: rgba(28,26,23,0.45);
    z-index: 90;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s ease;
  }
  .sidebar__overlay.is-open { opacity: 1; pointer-events: auto; }

  .topbar { padding: 10px 14px; gap: 10px; }
  .topbar__burger { display: inline-flex; }
  .topbar__app-tag { font-size: 10px; padding: 4px 9px 4px 7px; }
  .topbar__app-tag::before { width: 6px; height: 6px; }
  .topbar__crumbs { font-size: 12px; gap: 6px; }
  .topbar__crumbs strong { font-size: 13px; }
  .topbar__stats { display: none; }

  .content { padding: 16px 14px 80px; }

  .hero-grid,
  .hero-grid--2,
  .hero-grid--3 { grid-template-columns: 1fr !important; gap: 10px; margin-bottom: 14px; }
  .hero-card { padding: 14px 14px 14px; }
  .hero-card__value { font-size: 26px; }
  .hero-card__actions { padding-top: 10px; }

  .stat-row,
  .stat-row--3 { grid-template-columns: 1fr 1fr !important; gap: 8px; }
  .stat__value { font-size: 22px; }

  .page-head { gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .page-head h1 { font-size: 26px; }
  .page-head__sub { font-size: 13px; }
  .page-head__actions { width: 100%; margin-left: 0; }

  .table { font-size: 12.5px; }
  .table-wrap { overflow-x: auto; }
}

/* ── PageHead ───────────────────────────────────────────────────────────── */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 14px; justify-content: flex-end; }
.page-head h1, .page-head__sub { display: none; }
.page-head > div:first-child { display: none; }
.page-head--actions-only { justify-content: flex-end; margin-bottom: 14px; }
.page-head:not(:has(.page-head__actions)) { display: none; }
.page-head h1 { font-family: var(--font-sans); font-size: 32px; font-weight: 700; margin: 0; letter-spacing: -0.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.page-head__sub { color: var(--ink-3); font-size: 14px; margin-top: 6px; max-width: 720px; }
.page-head__actions { margin-left: auto; display: flex; gap: 10px; flex-shrink: 0; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn { border: 1px solid var(--line-2); background: #fff; color: var(--ink); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); transition: background .12s ease, transform .06s ease; }
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn--primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn--primary:hover { background: #000; }
.btn--accent { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 600; }
.btn--accent:hover { background: #ffb300; border-color: #ffb300; }
.btn--ghost { background: transparent; border-color: var(--line); color: var(--ink-2); box-shadow: none; }
.btn--ghost:hover { background: var(--paper-2); }
.btn--danger { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn--danger:hover { background: #f6c8cb; }
.btn--ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.btn--ok:hover { background: #c6e8d2; }
.btn--sm { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }

/* ── Copy icon button ───────────────────────────────────────────────────── */
.copy-btn {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px;
  padding: 0; margin: 0 0 0 6px;
  border: 1px solid var(--line);
  background: #fff; color: var(--ink-3);
  border-radius: 6px; cursor: pointer;
  vertical-align: middle; flex-shrink: 0;
  transition: color .12s ease, border-color .12s ease, background .12s ease;
}
.copy-btn:hover { color: var(--ink); border-color: var(--ink-4); background: var(--paper-2); }
.copy-btn:active { transform: translateY(1px); }
.copy-btn--ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.copy-btn--ok:hover { color: var(--ok); background: var(--ok-soft); }
.mono-copy { display: inline-flex; align-items: center; gap: 0; flex-wrap: nowrap; max-width: 100%; }
.mono-copy .mono { word-break: break-all; }

/* ── Filter chips ───────────────────────────────────────────────────────── */
.chips { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 4px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: #fff; cursor: pointer; color: var(--ink-2); font-family: inherit; }
.chip:hover { border-color: var(--ink-3); }
.chip--active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.chip--add { border-style: dashed; border-color: var(--line-2); color: var(--ink-3); background: transparent; }
.chip__count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--paper-2); font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.chip--active .chip__count { background: rgba(0,0,0,0.14); color: #000; }
.chip__x { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,0.06); font-size: 11px; line-height: 1; }
.chip--active .chip__x { background: rgba(0,0,0,0.14); }
.chips__sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
.chips__saved { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }

/* ── Tables ─────────────────────────────────────────────────────────────── */
.table-wrap { border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; overflow: hidden; box-shadow: var(--shadow-sm); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table thead th { text-align: left; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 13px 16px; background: var(--paper-2); white-space: nowrap; border-bottom: 1px solid var(--line); }
.table tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr { cursor: pointer; transition: background .1s ease; }
.table tbody tr:hover { background: var(--paper-2); }
.table tbody tr.is-selected { background: var(--accent-soft); }
.table tbody tr:last-child td { border-bottom: none; }
.table .num { font-family: var(--font-mono); font-size: 13px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.table .mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Inset table inside drawer/section: trims chrome */
.table--inset { border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.table--inset thead th { background: var(--paper); padding: 10px 12px; font-size: 10.5px; }
.table--inset tbody td { padding: 10px 12px; font-size: 13px; }

.cell-stack { display: flex; flex-direction: column; gap: 1px; }

.table-foot { display: flex; align-items: center; gap: 14px; padding: 13px 18px; background: #fff; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); }
.table-foot__pages { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.page-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.page-btn:hover:not(:disabled) { background: var(--paper-2); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-btn--active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

/* ── Pills / status ─────────────────────────────────────────────────────── */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--paper-2); color: var(--ink-2); border: none; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; opacity: 0.85; }
.pill--ok { background: var(--ok-soft); color: var(--ok); }
.pill--warn { background: var(--warn-soft); color: var(--warn); }
.pill--bad { background: var(--bad-soft); color: var(--bad); }
.pill--neutral { background: var(--paper-2); color: var(--ink-3); }
.pill--info { background: var(--info-soft); color: var(--info); }

/* ── Drawer ─────────────────────────────────────────────────────────────── */
.drawer-overlay { position: fixed; inset: 0; background: rgba(28,26,23,0.32); z-index: 5; animation: fadeIn .16s ease; backdrop-filter: blur(2px); }
.drawer { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(640px,90%); background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 6; display: flex; flex-direction: column; animation: slideIn .22s cubic-bezier(.2,.7,.2,1); overflow: hidden; }
.drawer--wide { width: min(820px,92%); }
@keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.drawer__head { padding: 18px 22px 16px; display: flex; align-items: center; gap: 10px; background: var(--paper-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer__head h3 { margin: 0; font-family: var(--font-sans); font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
.drawer__id { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); background: #fff; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
.drawer__close { margin-left: auto; border: 1px solid var(--line); background: #fff; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink-3); font-size: 14px; }
.drawer__close:hover { color: var(--ink); background: var(--paper-2); }
.drawer__body { padding: 20px 22px 26px; overflow: auto; flex: 1; }
.drawer__foot { border-top: 1px solid var(--line); padding: 12px 22px; display: flex; gap: 8px; align-items: center; background: var(--paper); flex-wrap: wrap; }
.drawer__foot .spacer { flex: 1; }

.dispute-sla { font-family: var(--font-mono); font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 3px 10px; border-radius: 999px; }

/* ── SLA banner (Dispute drawer) ─────────────────────────────────────── */
.sla-banner { margin: 12px 0 18px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: flex; flex-direction: column; gap: 10px; }
.sla-banner--bad  { background: var(--bad-soft);  border-color: transparent; }
.sla-banner--warn { background: var(--warn-soft); border-color: transparent; }
.sla-banner--info { background: var(--info-soft); border-color: transparent; }
.sla-banner--ok   { background: var(--ok-soft);   border-color: transparent; }
.sla-banner__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 13px; }
.sla-banner__label { color: var(--ink-3); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
.sla-banner__time { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
.sla-banner__time strong { font-weight: 700; }
.sla-banner__foot { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }

.sla-bar { width: 100%; height: 6px; border-radius: 999px; background: rgba(0,0,0,0.08); overflow: hidden; }
.sla-bar__fill { height: 100%; border-radius: 999px; transition: width .3s ease; }
.sla-banner--bad  .sla-bar__fill { background: var(--bad);  }
.sla-banner--warn .sla-bar__fill { background: var(--warn); }
.sla-banner--info .sla-bar__fill { background: var(--info); }
.sla-banner--ok   .sla-bar__fill { background: var(--ok);   }

/* ── KV list ────────────────────────────────────────────────────────────── */
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 10px 18px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-3); font-size: 12.5px; padding-top: 4px; font-weight: 500; }
.kv dd { margin: 0; color: var(--ink); }

/* ── Section card ───────────────────────────────────────────────────────── */
.section { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.section__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.section__title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
.section__rule { flex: 1; border-top: 1px solid var(--line); margin-left: 4px; }

/* ── Forms ──────────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field__label { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.field__input { border: 1px solid var(--line-2); background: #fff; border-radius: 9px; padding: 9px 12px; font-size: 14px; font-family: var(--font-sans); color: var(--ink); width: 100%; }
.field__input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field__hint { font-size: 12px; color: var(--ink-4); }
.field--row { flex-direction: row; align-items: center; gap: 12px; }
.field--row .field__label { min-width: 160px; flex-shrink: 0; }
.field--row .field__input { flex: 1; }
.field--row .field__hint { flex-basis: 100%; margin-left: 172px; margin-top: -4px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ── Modal ──────────────────────────────────────────────────────────────── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(28,26,23,0.42); z-index: 50; display: grid; place-items: center; backdrop-filter: blur(3px); animation: fadeIn .16s ease; }
.modal { width: min(640px,92%); background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.modal--wide { width: min(820px,94%); }
.modal__head { padding: 18px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal__head h3 { margin: 0; font-family: var(--font-sans); font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }
.modal__body { padding: 20px 22px; max-height: 70vh; overflow: auto; }
.modal__foot { border-top: 1px solid var(--line); padding: 12px 22px; display: flex; gap: 8px; background: var(--paper); align-items: center; }
.modal__foot .spacer { flex: 1; }

/* ── Stats ──────────────────────────────────────────────────────────────── */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.stat-row--3 { grid-template-columns: repeat(3, 1fr); }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; box-shadow: var(--shadow-sm); transition: border-color .12s; }
.stat--clickable { cursor: pointer; }
.stat--clickable:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.stat__label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.stat__value { font-family: var(--font-sans); font-size: 28px; font-weight: 700; margin-top: 4px; letter-spacing: -0.015em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat__value .ccy { font-size: 0.55em; font-weight: 500; color: var(--ink-3); margin-left: 0.15em; letter-spacing: 0.04em; }
.stat__delta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ── Tabs ───────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; background: var(--paper-2); padding: 4px; border-radius: 10px; margin-bottom: 16px; width: fit-content; }
.tab { padding: 6px 13px; font-size: 13px; color: var(--ink-3); cursor: pointer; border-radius: 7px; font-weight: 500; border: 0; background: transparent; appearance: none; font-family: inherit; }
.tab:hover { color: var(--ink-2); }
.tab--active { color: var(--ink); background: #fff; box-shadow: var(--shadow-sm); font-weight: 600; }

/* ── Timeline ───────────────────────────────────────────────────────────── */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--line-2); border-radius: 2px; }
.timeline li { position: relative; padding: 0 0 12px 28px; font-size: 13.5px; color: var(--ink); }
.timeline li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.timeline li.muted::before { border-color: var(--line-2); box-shadow: 0 0 0 3px var(--paper-2); }
.timeline li time { display: block; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); margin-bottom: 2px; }

/* ── Notes ──────────────────────────────────────────────────────────────── */
.note { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); }
.note--info { background: var(--info-soft); border-color: transparent; color: #1f4e92; }
.note--ok { background: var(--ok-soft); border-color: transparent; color: #1d6e3c; }
.note--warn { background: var(--warn-soft); border-color: transparent; color: #8c5a14; }
.note--bad { background: var(--bad-soft); border-color: transparent; color: #8a2a2e; }

/* ── Misc helpers ───────────────────────────────────────────────────────── */
.muted { color: var(--ink-3); }
.mono { font-family: var(--font-mono); }
.spacer { flex: 1; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }

/* ── Settings nav ───────────────────────────────────────────────────────── */
.settings { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: flex-start; }
.settings__nav { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow-sm); position: sticky; top: 0; }
.settings__nav button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.settings__nav button:hover { background: var(--paper-2); }
.settings__nav button.is-active { background: var(--accent); color: #000; font-weight: 600; }

/* ── Stepper (wizard) ───────────────────────────────────────────────────── */
.status-steps { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; }
.status-steps__step { flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-4); position: relative; padding: 22px 6px 0; }
.status-steps__step::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 8px; background: var(--paper-2); border-radius: 999px; }
.status-steps__step.is-done::before { background: var(--ink); }
.status-steps__step.is-current::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.status-steps__step.is-done, .status-steps__step.is-current { color: var(--ink); }

/* ── Usage bars (Payment Details) ───────────────────────────────────────── */
.usage { display: inline-flex; align-items: center; gap: 8px; }
.usage__bar { display: inline-block; width: 64px; height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; position: relative; }
.usage__bar > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.usage--warn .usage__bar > span { background: var(--warn); }
.usage--bad .usage__bar > span { background: var(--bad); }
.usage__num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); min-width: 28px; }
.usage--lg .usage__bar { width: 120px; height: 8px; }

/* ── Proof state inline ─────────────────────────────────────────────────── */
.proof { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-family: var(--font-mono); color: var(--ink-3); }
.proof--uploaded { color: var(--ok); font-weight: 600; }
.proof--rejected { color: var(--bad); font-weight: 600; }

.dot-dispute { color: var(--bad); font-size: 14px; line-height: 1; }
.rating { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }

/* ── Badges ─────────────────────────────────────────────────────────────── */
.badge-type { display: inline-block; padding: 2px 9px; border-radius: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--paper-2); color: var(--ink-2); }

/* ── Empty ──────────────────────────────────────────────────────────────── */
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); font-size: 13.5px; background: var(--paper); border: 1px dashed var(--line-2); border-radius: 10px; }

/* ── Placeholder image ──────────────────────────────────────────────────── */
.wf-placeholder { background: linear-gradient(135deg,var(--paper-2) 0%,var(--paper-3) 100%); border: 1px dashed var(--line-2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); text-align: center; padding: 12px; }

/* ── Dashboard chart ────────────────────────────────────────────────────── */
.chart { padding: 4px 0 0; }
.chart__legend { display: flex; gap: 18px; padding: 6px 0 0 30px; font-size: 12px; color: var(--ink-3); }
.chart__legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart__legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

/* ── Risk list (dashboard) ──────────────────────────────────────────────── */
.risk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.risk-list li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; font-size: 13px; cursor: pointer; transition: background .12s; }
.risk-list li:hover { background: var(--paper-2); }
.risk-list .mono { margin-left: auto; font-size: 12px; }

/* ── Role switcher (Support Queue header) ─────────────────────────────── */
.role-switcher { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 6px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
.role-switcher .chip { padding: 4px 12px; font-size: 12.5px; }

/* ── Dispute chat ───────────────────────────────────────────────────────── */
.chat { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 8px; max-height: 320px; overflow-y: auto; }
.chat__msg { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
.chat__msg--client { align-self: flex-start; }
.chat__msg--trader { align-self: flex-end; align-items: flex-end; }
.chat__msg--admin { align-self: flex-end; align-items: flex-end; }
.chat__meta { font-size: 11px; color: var(--ink-3); }
.chat__bubble { padding: 8px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; background: var(--paper-2); }
.chat__msg--trader .chat__bubble { background: var(--info-soft); color: #1f4e92; }
.chat__msg--admin .chat__bubble { background: var(--ink); color: #fff; }
.chat-input { display: flex; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
.chat-input .field__input { flex: 1; }

/* ── Number formatting ──────────────────────────────────────────────────── */

  const health = HEALTH_LABELS[ENV_INFO.health] || HEALTH_LABELS.ok;
  return (
    <div className={"env-badge" + (inline ? " env-badge--inline" : "") + (onDark ? " env-badge--on-dark" : "")} tabIndex={0}>
      <span className="env-badge__dot" style={{ background: tone.dot }} />
      <span className="env-badge__code" style={{ color: onDark ? "#fff" : tone.text }}>{ENV_INFO.env}</span>
      <div className="env-tip" role="tooltip">
        <div className="env-tip__head">
          <span className="env-tip__dot" style={{ background: tone.dot }} />
          <span className="env-tip__env" style={{ color: tone.text }}>{ENV_INFO.env}</span>
          <span className="env-tip__env-label">{ENV_INFO.envLabel}</span>
        </div>
        <div className="env-tip__rows">
          <div className="env-tip__row"><span>Frontend</span><b>{ENV_INFO.frontend}</b></div>
          <div className="env-tip__row"><span>Backend</span><b>{ENV_INFO.backend}</b></div>
        </div>
        <div className="env-tip__divider" />
        <div className="env-tip__rows">
          <div className="env-tip__row"><span>Статус</span><b className="env-tip__status"><i style={{ background: health.dot }} />{health.label}</b></div>
          <div className="env-tip__row"><span>Пинг</span><b>{ENV_INFO.pingMs} ms</b></div>
        </div>
      </div>
    </div>
  );
}

function Sidebar({ active, onChange, isOpen, onClose }) {
  const navById = Object.fromEntries(window.M_NAV.map((n) => [n.id, n]));
  return (
    <>
      <div className={"sidebar__overlay" + (isOpen ? " is-open" : "")} onClick={onClose} />
      <aside className={"sidebar" + (isOpen ? " is-open" : "")}>
        <div className="app-banner">
          <div className="app-banner__row">
            <div className="app-banner__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="5 12 10 17 19 7" />
              </svg>
            </div>
            <div className="app-banner__wordmark">
              <span className="app-banner__wordmark-1">Crowd</span><span className="app-banner__wordmark-2">Pay</span>
            </div>
            <EnvBadge />
          </div>
        </div>
        {window.M_NAV_GROUPS.map((g) => (
          <React.Fragment key={g.label || "_top"}>
            {g.label && <div className="sidebar__group">{g.label}</div>}
            {g.ids.map((id) => {
              const n = navById[id];
              if (!n) return null;
              return (
                <button
                  key={id}
                  className={"nav-item" + (active === id ? " nav-item--active" : "") + (n.disabled ? " nav-item--disabled" : "")}
                  onClick={() => { if (!n.disabled) onChange(id); }}
                  disabled={n.disabled}
                  aria-disabled={n.disabled ? "true" : undefined}
                >
                  <span className="nav-item__icon"><NavIcon id={n.icon || id} /></span>
                  <span>{n.label}</span>
                  {n.disabled
                    ? <span className="nav-item__count">скоро</span>
                    : (n.count != null && n.count > 0 && <span className="nav-item__count">{n.count}</span>)}
                </button>
              );
            })}
          </React.Fragment>
        ))}
        <ProfileFooterMenu initials={window.ME_MERCHANT.name.slice(0,2).toUpperCase()} name={window.ME_MERCHANT.name} sub={window.ME_MERCHANT.id + " · merchant"} onProfile={() => onChange("profile")}><ThemeToggle /></ProfileFooterMenu>
      </aside>
    </>
  );
}

function Topbar({ active, onMenuClick, onHomeClick }) {
  const n = window.M_NAV.find((x) => x.id === active);
  const m = window.ME_MERCHANT;
  const todayPayIn  = (m.today && m.today.payInRub)  || 0;
  const todayPayOut = (m.today && m.today.payOutRub) || 0;
  const fmt = (n) => Math.round(n).toLocaleString("ru-RU");
  return (
    <header className="topbar">
      <button className="topbar__burger" onClick={onMenuClick} aria-label="Меню">☰</button>
      <button type="button" className="topbar__app-tag" onClick={onHomeClick} aria-label="На главную">Merchant</button>
      <div className="topbar__crumbs">
        <span style={{ color: "var(--ink-4)" }}>/</span>
        <strong>{n ? n.label : (active === "profile" ? "Мой профиль" : active)}</strong>
      </div>
      <div className="topbar__stats">
        <div className="topbar__stat">
          <span className="topbar__stat-value">
            <span className="topbar__stat-icon" aria-hidden="true"><NavIcon id="payin" /></span>
            {fmt(todayPayIn / 92.4)} <span className="ccy">USDT</span>
          </span>
        </div>
        <div className="topbar__stat">
          <span className="topbar__stat-value">
            <span className="topbar__stat-icon" aria-hidden="true"><NavIcon id="payout" /></span>
            {fmt(todayPayOut / 92.4)} <span className="ccy">USDT</span>
          </span>
        </div>
      </div>
    </header>
  );
}

function App() {
  const [active, setActive] = React.useState("dashboard");
  const [sidebarOpen, setSidebarOpen] = React.useState(false);
  const [tweaks, setTweak] = useTweaks(window.__TWEAK_DEFAULTS__);

  React.useEffect(() => {
    document.documentElement.style.setProperty("--accent", tweaks.accent);
    document.documentElement.style.setProperty("--accent-soft", tweaks.accent + "22");
  }, [tweaks.accent]);

  React.useEffect(() => {
    const map = { compact: "8px 12px", regular: "13px 16px", comfy: "18px 18px" };
    const px = map[tweaks.density] || map.regular;
    let style = document.getElementById("__density");
    if (!style) {
      style = document.createElement("style");
      style.id = "__density";
      document.head.appendChild(style);
    }
    style.textContent = `.table tbody td { padding: ${px}; }`;
  }, [tweaks.density]);

  const [pendingOpen, setPendingOpen] = React.useState(null);
  const goTo = (id, openId) => {
    setActive(id);
    setSidebarOpen(false);
    if (openId !== undefined) setPendingOpen({ section: id, id: openId, key: Date.now() });
  };
  const initOpenFor = (sec) => (pendingOpen && pendingOpen.section === sec)
    ? pendingOpen.id + ":" + pendingOpen.key
    : null;
  const initOpenIdFor = (sec) => (pendingOpen && pendingOpen.section === sec) ? pendingOpen.id : null;

  return (
    <>
      <div className="app">
        <Sidebar active={active} onChange={(id) => { setActive(id); setSidebarOpen(false); }} isOpen={sidebarOpen} onClose={() => setSidebarOpen(false)} />
        <main className="main">
          <Topbar active={active} onMenuClick={() => setSidebarOpen(true)} onHomeClick={() => setActive("dashboard")} />
          <div className="content">
            {active === "dashboard"  && <MerchantDashboard onGo={goTo} />}
            {active === "payin"      && <MerchantPayIn key={initOpenFor("payin") || "payin"} initOpenId={initOpenIdFor("payin")} />}
            {active === "payout"     && <MerchantPayOut key={initOpenFor("payout") || "payout"} initOpenId={initOpenIdFor("payout")} />}
            {active === "disputes"   && <MerchantDisputes />}
            {active === "settlement" && <MerchantSettlement onGo={goTo} />}
            {active === "webhooks"   && <MerchantWebhooks />}
            {active === "api"        && <MerchantApi />}
            {active === "settings"   && <MerchantSettings />}
            {active === "profile"    && <AccountProfile user={{ initials: "АС", name: "Анна Смирнова", login: "anna@" + window.ME_MERCHANT.name.toLowerCase().replace(/\s+/g, "") + ".io", id: window.ME_MERCHANT.id + "-U1", type: "Юзер мерчанта", roles: ["Админ мерчанта · встроенная"], org: window.ME_MERCHANT.name + " · " + window.ME_MERCHANT.id, created: "03.02.2026", lastLogin: "20.07.2026 09:02" }} />}
          </div>
        </main>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakColor  label="Accent" value={tweaks.accent} onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Layout" />
        <TweakRadio  label="Density" value={tweaks.density}
                     options={["compact", "regular", "comfy"]}
                     onChange={(v) => setTweak("density", v)} />
        <TweakSection label="Navigation" />
        <TweakSelect label="Открыть раздел" value={active}
                     options={window.M_NAV.filter((n) => !n.disabled).map((n) => ({ value: n.id, label: n.label }))}
                     onChange={setActive} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
