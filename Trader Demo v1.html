<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrowdPay — Trader Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>

:root {
  --paper: #faf6ee;
  --paper-2: #f3ecdb;
  --paper-3: #ebe2cc;
  --ink: #1c1a17;
  --ink-2: #3d3933;
  --ink-3: #807a6e;
  --ink-4: #b9b1a0;
  --line: #e3dcc9;
  --line-2: #d6cdb4;
  --accent: #ef6a3c;
  --accent-2: #ffb27a;
  --accent-soft: #fde6d6;
  --accent-ink: #8a3712;
  --plum: #5b4b8a;
  --plum-soft: #ece6f7;
  --teal: #1f8f86;
  --teal-soft: #d4ece9;
  --ok: #2f9956;
  --ok-soft: #d6efe0;
  --warn: #d98a1c;
  --warn-soft: #fbe9c8;
  --bad: #d94248;
  --bad-soft: #fadcde;
  --info: #3a7bd5;
  --info-soft: #dde9fa;
  --radius: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 0 rgba(28,26,23,0.04), 0 2px 6px rgba(28,26,23,0.04);
  --shadow-md: 0 1px 0 rgba(28,26,23,0.04), 0 8px 24px rgba(28,26,23,0.07);
  --shadow-lg: 0 10px 40px rgba(28,26,23,0.14);
  --font-sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
  --font-display: "Fraunces", "Inter Tight", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--paper);
  background-image:
    radial-gradient(1200px 600px at 90% -10%, rgba(239,106,60,0.08), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(91,75,138,0.06), transparent 60%);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ── Layout shell ───────────────────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 256px 1fr; height: 100vh; }
.sidebar { padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); overflow-y: auto; }
.sidebar__brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 18px; margin-bottom: 10px; }
.sidebar__brand-mark { width: 36px; height: 36px; background: var(--ink); color: var(--paper); border-radius: 10px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 var(--accent); }
.sidebar__brand-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.sidebar__brand-tag { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3); background: var(--paper-2); padding: 2px 8px; border-radius: 999px; }
.sidebar__group { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-4); padding: 14px 12px 6px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); cursor: pointer; user-select: none; font-size: 14px; font-weight: 500; transition: background .12s ease; border: none; background: transparent; text-align: left; width: 100%; }
.nav-item:hover { background: var(--paper-2); }
.nav-item--active, .nav-item--active:hover { background: var(--ink); color: var(--paper); box-shadow: var(--shadow-md); }
.nav-item--active .nav-item__count { color: var(--accent-2); }
.nav-item__icon { width: 24px; height: 24px; background: var(--paper-2); border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 600; font-size: 12px; flex-shrink: 0; color: var(--ink-2); }
.nav-item--active .nav-item__icon { background: var(--accent); color: #fff; }
.nav-item__count { margin-left: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); padding: 1px 7px; border-radius: 999px; background: var(--paper-2); }
.nav-item--active .nav-item__count { background: rgba(255,255,255,0.08); }
.sidebar__footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); }
.sidebar__avatar { width: 34px; height: 34px; background: var(--plum); color: #fff; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; }

.main { display: flex; flex-direction: column; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 14px 32px; border-bottom: 1px solid var(--line); background: var(--paper); }
.topbar__crumbs { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); }
.topbar__crumbs strong { color: var(--ink); font-weight: 600; font-size: 14px; }
.topbar__search { margin-left: auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 13px; color: var(--ink-3); min-width: 260px; box-shadow: var(--shadow-sm); }
.topbar__kbd { margin-left: auto; border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; font-size: 10.5px; background: var(--paper); font-family: var(--font-mono); }

.content { flex: 1; overflow: auto; padding: 26px 32px 60px; position: relative; }

/* ── PageHead ───────────────────────────────────────────────────────────── */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.page-head h1 { font-family: var(--font-display); font-size: 36px; font-weight: 600; margin: 0; letter-spacing: -0.025em; line-height: 1.05; }
.page-head__sub { color: var(--ink-3); font-size: 14px; margin-top: 6px; max-width: 720px; }
.page-head__actions { margin-left: auto; display: flex; gap: 10px; flex-shrink: 0; }

/* ── Buttons ────────────────────────────────────────────────────────────── */
.btn { border: 1px solid var(--line-2); background: #fff; color: var(--ink); padding: 9px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm); transition: background .12s ease, transform .06s ease; }
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn--primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn--primary:hover { background: #000; }
.btn--accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn--accent:hover { background: #d85929; }
.btn--ghost { background: transparent; border-color: var(--line); color: var(--ink-2); box-shadow: none; }
.btn--ghost:hover { background: var(--paper-2); }
.btn--danger { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn--danger:hover { background: #f6c8cb; }
.btn--ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.btn--ok:hover { background: #c6e8d2; }
.btn--sm { padding: 5px 12px; font-size: 12.5px; border-radius: 8px; }

/* ── Filter chips ───────────────────────────────────────────────────────── */
.chips { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 4px 0 16px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: #fff; cursor: pointer; color: var(--ink-2); font-family: inherit; }
.chip:hover { border-color: var(--ink-3); }
.chip--active { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip--add { border-style: dashed; border-color: var(--line-2); color: var(--ink-3); background: transparent; }
.chip__count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--paper-2); font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; color: var(--ink-2); }
.chip--active .chip__count { background: rgba(255,255,255,0.16); color: var(--accent-2); }
.chip__x { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,0.06); font-size: 11px; line-height: 1; }
.chip--active .chip__x { background: rgba(255,255,255,0.18); }
.chips__sep { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
.chips__saved { margin-left: auto; font-size: 12.5px; color: var(--ink-3); }

/* ── Tables ─────────────────────────────────────────────────────────────── */
.table-wrap { border: 1px solid var(--line); border-radius: var(--radius-lg); background: #fff; overflow: hidden; box-shadow: var(--shadow-sm); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table thead th { text-align: left; font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); padding: 13px 16px; background: var(--paper-2); white-space: nowrap; border-bottom: 1px solid var(--line); }
.table tbody td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr { cursor: pointer; transition: background .1s ease; }
.table tbody tr:hover { background: var(--paper-2); }
.table tbody tr.is-selected { background: var(--accent-soft); }
.table tbody tr:last-child td { border-bottom: none; }
.table tbody td.num { font-family: var(--font-mono); font-size: 13px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.table thead th.num { text-align: right; }
.table .mono { font-family: var(--font-mono); font-size: 12.5px; }

/* Inset table inside drawer/section: trims chrome */
.table--inset { border-radius: 8px; border: 1px solid var(--line); overflow: hidden; }
.table--inset thead th { background: var(--paper); padding: 10px 12px; font-size: 10.5px; }
.table--inset tbody td { padding: 10px 12px; font-size: 13px; }

.cell-stack { display: flex; flex-direction: column; gap: 1px; }

.table-foot { display: flex; align-items: center; gap: 14px; padding: 13px 18px; background: #fff; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); }
.table-foot__pages { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.page-btn { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); background: #fff; border-radius: 7px; cursor: pointer; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.page-btn:hover:not(:disabled) { background: var(--paper-2); }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-btn--active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ── Pills / status ─────────────────────────────────────────────────────── */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--paper-2); color: var(--ink-2); border: none; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; opacity: 0.85; }
.pill--ok { background: var(--ok-soft); color: var(--ok); }
.pill--warn { background: var(--warn-soft); color: var(--warn); }
.pill--bad { background: var(--bad-soft); color: var(--bad); }
.pill--neutral { background: var(--paper-2); color: var(--ink-3); }
.pill--info { background: var(--info-soft); color: var(--info); }

/* ── Drawer ─────────────────────────────────────────────────────────────── */
.drawer-overlay { position: fixed; inset: 0; background: rgba(28,26,23,0.32); z-index: 5; animation: fadeIn .16s ease; backdrop-filter: blur(2px); }
.drawer { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(640px,90%); background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 6; display: flex; flex-direction: column; animation: slideIn .22s cubic-bezier(.2,.7,.2,1); overflow: hidden; }
.drawer--wide { width: min(820px,92%); }
@keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.drawer__head { padding: 18px 22px 16px; display: flex; align-items: center; gap: 10px; background: var(--paper-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.drawer__head h3 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.drawer__id { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-3); background: #fff; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
.drawer__close { margin-left: auto; border: 1px solid var(--line); background: #fff; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink-3); font-size: 14px; }
.drawer__close:hover { color: var(--ink); background: var(--paper-2); }
.drawer__body { padding: 20px 22px 26px; overflow: auto; flex: 1; }
.drawer__foot { border-top: 1px solid var(--line); padding: 12px 22px; display: flex; gap: 8px; align-items: center; background: var(--paper); flex-wrap: wrap; }
.drawer__foot .spacer { flex: 1; }

.dispute-sla { font-family: var(--font-mono); font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 3px 10px; border-radius: 999px; }

/* ── KV list ────────────────────────────────────────────────────────────── */
.kv { display: grid; grid-template-columns: 160px 1fr; gap: 10px 18px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink-3); font-size: 12.5px; padding-top: 4px; font-weight: 500; }
.kv dd { margin: 0; color: var(--ink); }

/* ── Section card ───────────────────────────────────────────────────────── */
.section { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
.section__head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.section__title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
.section__rule { flex: 1; border-top: 1px solid var(--line); margin-left: 4px; }

/* ── Forms ──────────────────────────────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field__label { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.field__input { border: 1px solid var(--line-2); background: #fff; border-radius: 9px; padding: 9px 12px; font-size: 14px; font-family: var(--font-sans); color: var(--ink); width: 100%; }
.field__input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field__hint { font-size: 12px; color: var(--ink-4); }
.field--row { flex-direction: row; align-items: center; gap: 12px; }
.field--row .field__label { min-width: 160px; flex-shrink: 0; }
.field--row .field__input { flex: 1; }
.field--row .field__hint { flex-basis: 100%; margin-left: 172px; margin-top: -4px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ── Modal ──────────────────────────────────────────────────────────────── */
.modal-backdrop { position: fixed; inset: 0; background: rgba(28,26,23,0.42); z-index: 50; display: grid; place-items: center; backdrop-filter: blur(3px); animation: fadeIn .16s ease; }
.modal { width: min(640px,92%); background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
.modal--wide { width: min(820px,94%); }
.modal__head { padding: 18px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal__head h3 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.modal__body { padding: 20px 22px; max-height: 70vh; overflow: auto; }
.modal__foot { border-top: 1px solid var(--line); padding: 12px 22px; display: flex; gap: 8px; background: var(--paper); align-items: center; }
.modal__foot .spacer { flex: 1; }

/* ── Stats ──────────────────────────────────────────────────────────────── */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.stat-row--3 { grid-template-columns: repeat(3, 1fr); }
.stat { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px 12px; box-shadow: var(--shadow-sm); transition: border-color .12s; }
.stat--clickable { cursor: pointer; }
.stat--clickable:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
.stat__label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.stat__value { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin-top: 4px; letter-spacing: -0.02em; line-height: 1.1; }
.stat__delta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ── Tabs ───────────────────────────────────────────────────────────────── */
.tabs { display: flex; gap: 4px; background: var(--paper-2); padding: 4px; border-radius: 10px; margin-bottom: 16px; width: fit-content; }
.tab { padding: 6px 13px; font-size: 13px; color: var(--ink-3); cursor: pointer; border-radius: 7px; font-weight: 500; border: 0; background: transparent; appearance: none; font-family: inherit; }
.tab:hover { color: var(--ink-2); }
.tab--active { color: var(--ink); background: #fff; box-shadow: var(--shadow-sm); font-weight: 600; }

/* ── Timeline ───────────────────────────────────────────────────────────── */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--line-2); border-radius: 2px; }
.timeline li { position: relative; padding: 0 0 12px 28px; font-size: 13.5px; color: var(--ink); }
.timeline li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.timeline li.muted::before { border-color: var(--line-2); box-shadow: 0 0 0 3px var(--paper-2); }
.timeline li time { display: block; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3); margin-bottom: 2px; }

/* ── Notes ──────────────────────────────────────────────────────────────── */
.note { padding: 12px 14px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; background: var(--paper-2); color: var(--ink-2); border: 1px solid var(--line); }
.note--info { background: var(--info-soft); border-color: transparent; color: #1f4e92; }
.note--ok { background: var(--ok-soft); border-color: transparent; color: #1d6e3c; }
.note--warn { background: var(--warn-soft); border-color: transparent; color: #8c5a14; }
.note--bad { background: var(--bad-soft); border-color: transparent; color: #8a2a2e; }

/* ── Misc helpers ───────────────────────────────────────────────────────── */
.muted { color: var(--ink-3); }
.mono { font-family: var(--font-mono); }
.spacer { flex: 1; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }

/* ── Settings nav ───────────────────────────────────────────────────────── */
.settings { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: flex-start; }
.settings__nav { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; box-shadow: var(--shadow-sm); position: sticky; top: 0; }
.settings__nav button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.settings__nav button:hover { background: var(--paper-2); }
.settings__nav button.is-active { background: var(--ink); color: #fff; }

/* ── Stepper (wizard) ───────────────────────────────────────────────────── */
.status-steps { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; }
.status-steps__step { flex: 1; text-align: center; font-size: 12px; font-weight: 600; color: var(--ink-4); position: relative; padding: 22px 6px 0; }
.status-steps__step::before { content: ""; position: absolute; top: 6px; left: 0; right: 0; height: 8px; background: var(--paper-2); border-radius: 999px; }
.status-steps__step.is-done::before { background: var(--ink); }
.status-steps__step.is-current::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.status-steps__step.is-done, .status-steps__step.is-current { color: var(--ink); }

/* ── Usage bars (Payment Details) ───────────────────────────────────────── */
.usage { display: inline-flex; align-items: center; gap: 8px; }
.usage__bar { display: inline-block; width: 64px; height: 6px; background: var(--paper-2); border-radius: 999px; overflow: hidden; position: relative; }
.usage__bar > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.usage--warn .usage__bar > span { background: var(--warn); }
.usage--bad .usage__bar > span { background: var(--bad); }
.usage__num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); min-width: 28px; }
.usage--lg .usage__bar { width: 120px; height: 8px; }

/* ── Proof state inline ─────────────────────────────────────────────────── */
.proof { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-family: var(--font-mono); color: var(--ink-3); }
.proof--uploaded { color: var(--ok); font-weight: 600; }
.proof--rejected { color: var(--bad); font-weight: 600; }

.dot-dispute { color: var(--bad); font-size: 14px; line-height: 1; }
.rating { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); }

/* ── Badges ─────────────────────────────────────────────────────────────── */

  .twk-btn:hover{background:rgba(0,0,0,.88)}
  .twk-btn.secondary{background:rgba(0,0,0,.06);color:inherit}
  .twk-btn.secondary:hover{background:rgba(0,0,0,.1)}

  .twk-swatch{appearance:none;-webkit-appearance:none;width:56px;height:22px;
    border:.5px solid rgba(0,0,0,.1);border-radius:6px;padding:0;cursor:default;
    background:transparent;flex-shrink:0}
  .twk-swatch::-webkit-color-swatch-wrapper{padding:0}
  .twk-swatch::-webkit-color-swatch{border:0;border-radius:5.5px}
  .twk-swatch::-moz-color-swatch{border:0;border-radius:5.5px}
`;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-presets="react">
/* inlined: primitives.jsx */
// Reusable UI primitives for CrowdPay v3

function Pill({ tone = "neutral", children }) {
  return <span className={"pill pill--" + tone}>{children}</span>;
}

function StatusPill({ map, value }) {
  const s = map[value] || { label: value, tone: "neutral" };
  return <Pill tone={s.tone}>{s.label}</Pill>;
}

function Btn({ variant = "default", size, onClick, children, disabled, title }) {
  const cls = ["btn"];
  if (variant !== "default") cls.push("btn--" + variant);
  if (size === "sm") cls.push("btn--sm");
  return (
    <button className={cls.join(" ")} onClick={onClick} disabled={disabled} title={title}>
      {children}
    </button>
  );
}

function Chip({ active, onClick, children, removable, dashed }) {
  const cls = ["chip"];
  if (active) cls.push("chip--active");
  if (dashed) cls.push("chip--add");
  return (
    <button className={cls.join(" ")} onClick={onClick}>
      {children}
      {removable && <span className="chip__x">×</span>}
    </button>
  );
}

function Section({ title, action, children }) {
  return (
    <div className="section">
      <div className="section__head">
        <span className="section__title">{title}</span>
        <span className="section__rule" />
        {action}
      </div>
      {children}
    </div>
  );
}

function Field({ label, hint, children, row }) {
  return (
    <div className={"field" + (row ? " field--row" : "")}>
      <label className="field__label">{label}</label>
      {children}
      {hint && <span className="field__hint">{hint}</span>}
    </div>
  );
}

function TextInput({ value, onChange, placeholder, mono, readOnly }) {
  return (
    <input
      className="field__input"
      style={mono ? { fontFamily: "var(--font-mono)", fontSize: 12.5 } : null}
      value={value || ""}
      placeholder={placeholder}
      readOnly={readOnly}
      onChange={(e) => onChange && onChange(e.target.value)}
    />
  );
}

function Select({ value, onChange, options }) {
  return (
    <select className="field__input" value={value} onChange={(e) => onChange && onChange(e.target.value)}>
      {options.map((o) => (
        <option key={o.value} value={o.value}>{o.label}</option>
      ))}
    </select>
  );
}

function Drawer({ title, id, status, statusMap, children, footer, onClose, wide, extraTags }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose && onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <>
      <div className="drawer-overlay" onClick={onClose} />
      <aside className={"drawer" + (wide ? " drawer--wide" : "")}>
        <header className="drawer__head">
          <h3>{title}</h3>
          {id && <span className="drawer__id">{id}</span>}
          {status && statusMap && <StatusPill map={statusMap} value={status} />}
          {extraTags}
          <button className="drawer__close" onClick={onClose} aria-label="Закрыть">✕</button>
        </header>
        <div className="drawer__body">{children}</div>
        {footer && <div className="drawer__foot">{footer}</div>}
      </aside>
    </>
  );
}

function Modal({ title, children, footer, onClose, wide }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose && onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={wide ? { maxWidth: 760, width: "92%" } : null} onClick={(e) => e.stopPropagation()}>
        <header className="modal__head">
          <h3>{title}</h3>
          <button className="drawer__close" style={{ marginLeft: "auto" }} onClick={onClose} aria-label="Закрыть">✕</button>
        </header>
        <div className="modal__body">{children}</div>
        {footer && <div className="modal__foot">{footer}</div>}
      </div>
    </div>
  );
}

function Tabs({ tabs, value, onChange }) {
  return (
    <div className="tabs">
      {tabs.map((t) => (
        <button key={t.id} className={"tab " + (value === t.id ? "tab--active" : "")} onClick={() => onChange(t.id)}>
          {t.label}
        </button>
      ))}
    </div>
  );
}

function PageHead({ title, sub, actions }) {
  return (
    <div className="page-head">
      <div>
        <h1>{title}</h1>
        {sub && <div className="page-head__sub">{sub}</div>}
      </div>
      {actions && <div className="page-head__actions">{actions}</div>}
    </div>
  );
}

function Timeline({ items }) {
  return (
    <ul className="timeline">
      {items.map((it, i) => (
        <li key={i} className={it.muted ? "is-muted" : ""}>
          <time>{it.time}</time>
          {it.text}
        </li>
      ))}
    </ul>
  );
}

function KV({ items }) {
  return (
    <dl className="kv">
      {items.map(([k, v], i) => (
        <React.Fragment key={i}>
          <dt>{k}</dt>
          <dd>{v}</dd>
        </React.Fragment>
      ))}
    </dl>
  );
}

function Empty({ children }) {
  return <div className="empty">{children}</div>;
}

function FilterChips({ filters, value, onChange }) {
  return (
    <div className="chips">
      {filters.map((f) => (
        <Chip key={f.value} active={value === f.value} onClick={() => onChange(f.value)}>
          {f.label}{f.count != null && <span className="chip__count">{f.count}</span>}
        </Chip>
      ))}
      <span className="chips__sep" />
      <Chip dashed>+ Фильтр</Chip>
      <span className="chips__saved">Сохранённые виды: <strong>Сегодня</strong></span>
    </div>
  );
}

function PlaceholderImg({ label = "Чек / документ", h = 120 }) {
  return (
    <div className="wf-placeholder" style={{ height: h }}>
      <div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, marginBottom: 4 }}>📎</div>
        {label}
      </div>
    </div>
  );
}

function Note({ tone = "neutral", children }) {
  return <div className={"note note--" + tone}>{children}</div>;
}

Object.assign(window, {
  Pill, StatusPill, Btn, Chip, Section, Field, TextInput, Select,
  Drawer, Modal, Tabs, PageHead, Timeline, KV, Empty, FilterChips,
  PlaceholderImg, Note,
});

</script>

// ─── Helpers ───────────────────────────────────────────────────────────────
function fmtMoney(v, currency = "RUB") {
  const sign = v < 0 ? "−" : "";
  const abs = Math.abs(v);
  let formatted;
  if (currency === "USDT") {
    formatted = abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  } else {
    formatted = Math.round(abs).toLocaleString("ru-RU");
  }
  const symbol = currency === "RUB" ? "₽" : currency === "USDT" ? "USDT" : currency;
  return (
    <>
      {sign + formatted}
      <span className="ccy"> {symbol}</span>
    </>
  );
}

function fmtPct(v) {
  return (v * 100).toFixed(0) + "%";
}

function bankName(id) {
  const b = BANKS.find((x) => x.id === id);
  return b ? b.name : id;
}

// ─── PAYOUT ───────────────────────────────────────────────────────────────
function TraderPayOut({ initFilter }) {
  const [filter, setFilter] = React.useState("free");
  React.useEffect(() => {
    if (initFilter && initFilter.value) setFilter(initFilter.value);
  }, [initFilter && initFilter.key]);
  const [openId, setOpenId] = React.useState(null);
  const filters = [
    { value: "free", label: "Свободные", count: PAY_OUT.filter((o) => o.status === "free").length },
    { value: "mine", label: "Мои в работе", count: PAY_OUT.filter((o) => o.takenBy === ME.id && ["in-progress","waiting-review"].includes(o.status)).length },
    { value: "completed", label: "Выполненные", count: PAY_OUT.filter((o) => o.takenBy === ME.id && o.status === "completed").length },
    { value: "rejected", label: "Отклонённые", count: PAY_OUT.filter((o) => o.takenBy === ME.id && o.status === "rejected").length },
    { value: "disputed", label: "Спор", count: PAY_OUT.filter((o) => o.status === "disputed").length },
    { value: "all", label: "Все", count: PAY_OUT.length },
  ];
  const visible = PAY_OUT.filter((o) => {
    if (filter === "all") return true;
    if (filter === "free") return o.status === "free";
    if (filter === "mine") return o.takenBy === ME.id && ["in-progress","waiting-review"].includes(o.status);
    if (filter === "completed") return o.takenBy === ME.id && o.status === "completed";
    if (filter === "rejected") return o.takenBy === ME.id && o.status === "rejected";
    if (filter === "disputed") return o.status === "disputed";
    return true;
  });
  const open = PAY_OUT.find((o) => o.id === openId);

  return (
    <>
      <PageHead
        title="Выплаты (PayOut)"
        sub="Свободные заявки попадают в общий пул. Возьмите → переведите клиенту → загрузите чек. На исполнение даётся 15 минут."
        actions={<Btn variant="ghost"><span className="mono">↧</span> Экспорт CSV</Btn>}
      />
      <FilterChips filters={filters} value={filter} onChange={setFilter} />

      <div className="table-wrap">
        <table className="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Создана</th>
              <th style={{ width: 110 }}>Статус</th>
              <th className="num">Сумма</th>
              <th className="num">Курс</th>
              <th className="num">Комиссия</th>
              <th>Реквизит</th>
              <th>Получатель</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {visible.map((o) => {
              const rate = ME.usdtRate;
              const usdt = o.amount / rate;
              const bankRow = TARIFF.banks.find((b) => b.bank === o.customerBank);
              const ratePct = bankRow ? bankRow.payOutTrader : TARIFF.payOutRateTrader;
              const fee = usdt * (ratePct / 100);
              const isOk = o.status === "completed";
              const showPd = isOk || o.status === "in-progress" || o.status === "waiting-review";
              const myPd = PAYMENT_DETAILS.find((p) => p.bank === o.customerBank && p.status === "active") || PAYMENT_DETAILS.find((p) => p.bank === o.customerBank);
              return (
              <tr key={o.id} className={openId === o.id ? "is-selected" : ""} onClick={() => setOpenId(o.id)}>
                <td className="mono">{o.id}</td>
                <td className="mono">{o.date}</td>
                <td><StatusPill map={PAY_OUT_STATUS} value={o.status} /></td>
                <td className="num">
                  {fmtMoney(o.amount, "RUB")}
                  <div className="mono muted" style={{ fontSize: 11.5, marginTop: 2 }}>{usdt.toFixed(2)} USDT</div>
                </td>
                <td className="num mono muted">{rate.toFixed(2)}</td>
                <td className="num mono">{fee.toFixed(2)}</td>
                <td>
                  {showPd && myPd ? (
                    <>
                      <div>{myPd.holder}</div>
                      <div className="mono muted" style={{ fontSize: 11.5, marginTop: 2 }}>{myPd.target}</div>
                    </>
                  ) : <span className="muted">—</span>}
                </td>
                <td>
                  <div><span className="muted">{bankName(o.customerBank)}</span> {o.customerName}</div>
                  <div className="mono muted" style={{ fontSize: 11.5, marginTop: 2 }}>{o.customerTarget}</div>
                </td>
                <td className="num">
                  {o.status === "free" && (
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 3 }}>
                      <Btn size="sm" variant="primary" onClick={(e) => { e.stopPropagation(); setOpenId(o.id); }}>Взять</Btn>
                      <span className="mono muted" style={{ fontSize: 11 }}>⧖ {o.deadlineMin} мин</span>
                    </div>
                  )}
                  {o.status === "in-progress" && o.takenBy === ME.id && (
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 3 }}>
                      <Btn size="sm" variant="ok" onClick={(e) => { e.stopPropagation(); setOpenId(o.id); }}>Чек</Btn>
                      <span className="mono muted" style={{ fontSize: 11 }}>⧖ {o.deadlineMin} мин</span>
                    </div>
                  )}
                </td>
              </tr>
            );})}
          </tbody>
        </table>
        <div className="table-foot">Показано <strong>{visible.length}</strong> из <strong>{PAY_OUT.length}</strong></div>
      </div>

      {open && <PayOutDrawer order={open} onClose={() => setOpenId(null)} />}
    </>
  );
}

function PayOutDrawer({ order, onClose }) {
  const isFree = order.status === "free";
  const isMine = order.takenBy === ME.id;
  const inWork = isMine && order.status === "in-progress";
  const waitingReview = isMine && order.status === "waiting-review";

  return (
    <Drawer
      title="Заявка на выплату"
      id={order.id}
      status={order.status}
      statusMap={PAY_OUT_STATUS}
      onClose={onClose}
      wide
      extraTags={(isFree || inWork) && <span className="dispute-sla mono">⏱ {order.deadlineMin} мин</span>}
      footer={
        isFree ? (
          <>

            <span className="spacer" />
            <Btn variant="primary">Взять в работу</Btn>

            <Btn variant="ok">Перевод сделан → загрузить чек</Btn>
          </>
        ) : waitingReview ? (
          <>
            <Btn variant="ghost">Открыть спор</Btn>
            <span className="spacer" />
            <Btn variant="ghost" disabled>Ждём проверки саппорта</Btn>
          </>
        ) : (
          <>
            <Btn variant="ghost">Открыть спор</Btn>
            <span className="spacer" />
            {order.proof === "uploaded" && <Btn variant="ghost">Скачать чек</Btn>}
          </>
        )
      }
    >
      <Section title="Куда платить">
        <KV items={[
          ["Сумма к переводу", <strong>{fmtMoney(order.amount, "RUB")}</strong>],
          ["Куда", <span className="mono"><strong>{order.customerTarget}</strong></span>],
          ["Банк получателя", <strong>{bankName(order.customerBank)}</strong>],

          ["Мерчант", order.merchant],

      {isFree && (
        <Note tone="warn">
          <strong>Внимание.</strong> При взятии заявки на ваш рабочий баланс заморозятся ≈ {fmtMoney(order.amount / ME.usdtRate, "USDT")} до подтверждения чека саппортом. Если не успеете за 15 минут — заявка вернётся в пул и рейтинг −0.05.
        </Note>
      )}

      <Section title="Расчёт">
        <KV items={[
          ["Эквивалент", <span className="mono">≈ {fmtMoney(order.amount / ME.usdtRate, "USDT")}</span>],
          ["Тариф PayOut", "2.0%"],
          ["Ваша комиссия", <strong>{fmtMoney(order.commissionUsdt, "USDT")}</strong>],
        ]} />
      </Section>

      <Section title="Чек / подтверждение">
        {order.proof === "uploaded" ? (
          <PlaceholderImg label={"Чек по " + order.id + (order.proofTime ? " · " + order.proofTime : "")} h={160} />
        ) : order.proof === "rejected" ? (
          <Note tone="bad">Чек отклонён саппортом: «Не читается номер операции». Загрузите новый чек.</Note>
        ) : inWork ? (
          <div>

          </div>
        ) : <Empty>Чек ещё не загружен</Empty>}

      {order.timeline && (
        <Section title="История">
          <Timeline items={order.timeline.map((t) => ({ time: t.ts, text: t.label }))} />
        </Section>

}

function DisputeDrawer({ dispute, onClose }) {
  const [chat, setChat] = React.useState(dispute.chat);
  const [draft, setDraft] = React.useState("");
  const canSend = ["open","waiting-trader","waiting-admin"].includes(dispute.status);
  const send = () => {
    if (!draft.trim()) return;
    setChat([...chat, { from: "trader", ts: "сейчас", text: draft.trim() }]);
    setDraft("");
  };
  const attach = () => setChat([...chat, { from: "trader", ts: "сейчас", attach: "receipt_" + dispute.order + ".jpg" }]);

  return (
    <Drawer
      title="Спор"
      id={dispute.id}
      status={dispute.status}
      statusMap={DISPUTE_STATUS}
      onClose={onClose}
      wide
      extraTags={dispute.deadline !== "—" && <span className="dispute-sla mono">SLA до {dispute.deadline}</span>}
      footer={dispute.status === "waiting-trader" ? (
        <>
          <Btn variant="ghost" onClick={attach}>📎 Прикрепить чек</Btn>
          <span className="spacer" />
          <Btn variant="ok" onClick={send}>Отправить</Btn>
        </>
      ) : <span className="muted" style={{ fontSize: 12 }}>Ожидает действий другой стороны</span>}
    >
      <Section title="Сводка">
        <KV items={[
          ["Ордер", <span className="mono">{dispute.order} · {dispute.orderType}</span>],
          ["Сумма", <strong>{fmtMoney(dispute.amount, "RUB")}</strong>],
          ["Мерчант", dispute.merchant],
          ["Клиент", dispute.customer],
          ["Открыт", <span className="mono">{dispute.opened}</span>],
          ["Дедлайн ответа", <span className="mono">{dispute.deadline}</span>],
          ["Причина", dispute.reason],
          ...(dispute.decision ? [["Решение", <strong>{dispute.decision}</strong>]] : []),
        ]} />
      </Section>

      <Section title="Переписка">
        <div className="chat">
          {chat.map((m, i) => {
            const role = m.from === "trader" ? "trader" : m.from === "merchant" ? "client" : "admin";
            const author = m.from === "trader" ? "Вы" : m.from === "merchant" ? dispute.merchant : "Саппорт";
            return (
              <div key={i} className={"chat__msg chat__msg--" + role}>
                <div className="chat__meta"><strong>{author}</strong> · <span className="mono">{m.ts}</span></div>
                <div className="chat__bubble">
                  {m.text}
                  {m.attach && (
                    <div style={{ marginTop: 6 }}>
                      <PlaceholderImg label={"📎 " + m.attach} h={120} />
                    </div>
                  )}
                </div>
              </div>
            );
          })}
          {chat.length === 0 && <Empty>Пока нет сообщений</Empty>}
        </div>
        <div className="chat-input">
          <button className="btn btn--ghost btn--sm" onClick={attach} disabled={!canSend} title="Прикрепить чек" style={{ padding: "0 12px" }}>📎</button>
          <input
            className="field__input"
            placeholder={canSend ? "Напишите сообщение саппорту..." : "Спор закрыт — отправка недоступна"}
            value={draft}
            disabled={!canSend}
            onChange={(e) => setDraft(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") send(); }}
          />
          <Btn variant="primary" size="sm" onClick={send} disabled={!canSend || !draft.trim()}>Отправить</Btn>
        </div>
      </Section>
    </Drawer>
  );
}

function ToggleRow({ label, hint, defaultOn }) {
  const [on, setOn] = React.useState(!!defaultOn);
  return (
    <div className="toggle-row">
      <div>
        <div className="toggle-row__label">{label}</div>
        {hint && <div className="toggle-row__hint">{hint}</div>}
      </div>
      <button className={"switch" + (on ? " switch--on" : "")} onClick={() => setOn(!on)} aria-pressed={on}>
        <span className="switch__thumb" />
      </button>
    </div>
  );
}

Object.assign(window, {
  TraderFinance, TraderRating, TraderDisputes, DisputeDrawer,
  TraderTariff, TraderProfile, ToggleRow,
});

</script>

<script type="text/babel" data-presets="react">
/* ── shell ───────────────────────────────────────────────────────────────── */

function Sidebar({ active, onChange }) {
  const navById = Object.fromEntries(NAV.map((n) => [n.id, n]));
  return (
    <aside className="sidebar" style={{ background: "linear-gradient(180deg, #f5edda 0%, var(--paper) 220px)" }}>
      <div className="app-banner">
        <div className="app-banner__row">
          <svg className="app-banner__logo" viewBox="0 0 100 100" aria-hidden="true">
            <mask id="cp-c-mask">
              <rect width="100" height="100" fill="#fff"/>
              <circle cx="50" cy="50" r="28" fill="#000"/>
              <rect x="50" y="40" width="55" height="20" fill="#000"/>
            </mask>
            <circle cx="50" cy="50" r="46" fill="var(--teal)" mask="url(#cp-c-mask)"/>
            <circle cx="50" cy="50" r="10" fill="var(--teal)"/>
          </svg>
          <div className="app-banner__name">CrowdPay</div>
          <div className="app-banner__role">trader</div>
        </div>
        {(() => {
          const w = BALANCES.working;
          const low = w.amount < w.minRequired;
          const fmt = (n) => n.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          return (
            <div className="app-banner__pulse">
              <div className="app-banner__pulse-label">
                <span>Рабочий баланс</span>
                {low && <span className="app-banner__balance-low">ниже мин.</span>}
              </div>
              <div className="app-banner__pulse-meta">
                <div className="app-banner__meta-row">
                  <span className="app-banner__meta-label">Активный</span>
                  <b>{fmt(w.amount)} <span className="ccy">USDT</span></b>
                </div>
                <div className="app-banner__meta-row">
                  <span className="app-banner__meta-label">Блок.</span>
                  <b>{fmt(BALANCES.working.frozenUsdt)} <span className="ccy">USDT</span></b>
                </div>
                <div className="app-banner__meta-row">
                  <span className="app-banner__meta-label">Курс</span>
                  <b>{ME.usdtRate.toFixed(2)} <span className="ccy">₽/USDT</span></b>
                </div>
              </div>
            </div>
          );
        })()}
      </div>
      {NAV_GROUPS.map((g) => (
        <React.Fragment key={g.label || "_top"}>
          {g.label && <div className="sidebar__group">{g.label}</div>}
          {g.ids.map((id) => {
            const item = navById[id];
            if (!item) return null;
            const isActive = active === id;
            return (
              <button
                key={id}
                className={"nav-item" + (isActive ? " nav-item--active" : "")}
                onClick={() => onChange(id)}
              >
                <span className="nav-item__icon">{item.icon}</span>
                <span>{item.label}</span>
                {item.count != null && item.count > 0 && (
                  <span className="nav-item__count">{item.count}</span>
                )}
              </button>
            );
          })}
        </React.Fragment>
      ))}
      <div className="sidebar__footer">
        <div className="sidebar__avatar" style={{ background: "var(--teal)" }}>АМ</div>
        <div style={{ lineHeight: 1.2 }}>
          <div style={{ fontWeight: 600, color: "var(--ink)" }}>{ME.name}</div>
          <div style={{ fontFamily: "var(--font-mono)", fontSize: 11 }}>{ME.id} · ⭐ {ME.rating}</div>
        </div>
      </div>
    </aside>
  );
}

function Topbar({ active }) {
  const n = NAV.find((x) => x.id === active);
  return (
    <header className="topbar">
      <span className="topbar__app-tag">Trader · {ME.name}</span>
      <div className="topbar__crumbs">
        <span style={{ color: "var(--ink-4)" }}>/</span>
        <strong>{n ? n.label : ""}</strong>
      </div>
      <div className="topbar__search">
        <span style={{ opacity: 0.6 }}>⌕</span>
        <span>Поиск ордеров, реквизитов, терминалов…</span>
        <span className="topbar__kbd">⌘K</span>
      </div>
    </header>
  );
}

function App() {
  const [active, setActive] = React.useState("dashboard");
  const [payOutInitFilter, setPayOutInitFilter] = React.useState(null);
  const [payInInitFilter, setPayInInitFilter] = React.useState(null);
  const [disputesInitFilter, setDisputesInitFilter] = React.useState(null);
  const [tweaks, setTweak] = useTweaks(window.__TWEAK_DEFAULTS__);

  React.useEffect(() => {
    document.documentElement.style.setProperty("--accent", tweaks.accent);
    document.documentElement.style.setProperty("--accent-soft", tweaks.accent + "22");
  }, [tweaks.accent]);

  const go = (target, opts) => {
    if (target === "payout" && opts && opts.filter) setPayOutInitFilter({ value: opts.filter, key: Date.now() });
    if (target === "payin" && opts && opts.filter) setPayInInitFilter({ value: opts.filter, key: Date.now() });
    if (target === "disputes" && opts && opts.filter) setDisputesInitFilter({ value: opts.filter, key: Date.now() });
    setActive(target);
  };

  return (
    <>
      <div className={"app density-" + (tweaks.density || "compact")}>
        <Sidebar active={active} onChange={setActive} />
        <main className="main">
          <Topbar active={active} />
          <div className="content">
            {active === "dashboard"  && <TraderDashboard go={go} />}
            {active === "payout"     && <TraderPayOut initFilter={payOutInitFilter} />}
            {active === "payin"      && <TraderPayIn initFilter={payInInitFilter} />}
            {active === "disputes"   && <TraderDisputes initFilter={disputesInitFilter} />}
            {active === "terminals"  && <TraderTerminals />}
            {active === "details"    && <TraderPaymentDetails />}
            {active === "finance"    && <TraderFinance go={go} />}
            {active === "tariff"     && <TraderTariff />}
            {active === "profile"    && <TraderProfile />}
          </div>
        </main>
      </div>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Accent">
          <TweakColor label="Accent color" value={tweaks.accent} onChange={(v) => setTweak("accent", v)} />
        </TweakSection>
        <TweakSection title="Density">
          <TweakRadio
            value={tweaks.density}
            onChange={(v) => setTweak("density", v)}
            options={[
              { value: "compact", label: "Compact" },
              { value: "cozy", label: "Cozy" },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
